services:
  - type: web
    name: meroallotment
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: IPO_WEB_SECRET
        generateValue: true
      - key: BROWSER_HEADLESS
        value: "1"
